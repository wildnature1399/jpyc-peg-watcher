# GitHub Actions で 5 分ごとに監視（PC・サーバー不要、スマホに Telegram で届く）
# Settings → Secrets and variables → Actions に
#   TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID を登録してください。
name: jpyc-peg-watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: jpyc-peg-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 連投防止用の state.json を前回実行から引き継ぐ
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: check
        run: python watcher.py --once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RENOTIFY_MIN: "30"
          TARGET_CHAINS: "polygon,ethereum"

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: state-${{ github.run_id }}
